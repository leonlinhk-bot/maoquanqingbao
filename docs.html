<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>监管文档库 · 猫圈儿港险情报站</title>
<link rel="icon" href="assets/logo-cat-64.jpg" />
<link rel="stylesheet" href="styles.css" />
<style>
body{background:var(--bg);color:var(--text);font-family:var(--font);margin:0;padding:0;line-height:1.55}
.doc-page{max-width:960px;margin:0 auto;padding:32px 22px 90px}

/* Hero */
.d-hero{padding:26px 0 24px;border-bottom:1px solid var(--border-soft);margin-bottom:22px}
.d-hero h1{font-size:27px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
.d-hero .sub{font-size:14px;color:var(--text-muted);max-width:680px}
.d-hero .sub b{color:var(--text)}
.d-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.d-badges span{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text-dim);background:var(--bg-elev)}

/* 免责 */
.d-disc{font-size:12px;color:var(--text-dim);line-height:1.65;border:1px solid var(--border-soft);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 15px;margin-bottom:24px;background:var(--bg-soft)}
.d-disc b{color:var(--warn)}

/* 视图切换 + 搜索 */
.d-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.d-views{display:flex;gap:4px;background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:9px;padding:3px}
.d-views button{font:inherit;font-size:12.5px;padding:6px 13px;border:0;border-radius:7px;background:transparent;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.d-views button.on{background:var(--accent-dim);color:var(--accent);font-weight:650}
.d-search{flex:1;min-width:180px;position:relative}
.d-search input{width:100%;box-sizing:border-box;font:inherit;font-size:13px;padding:8px 12px 8px 32px;border-radius:9px;border:1px solid var(--border-soft);background:var(--bg-elev);color:var(--text)}
.d-search input:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.d-search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px}

/* 场景块 */
.grp{margin-bottom:10px;border:1px solid var(--border-soft);border-radius:12px;overflow:hidden}
.grp.open{border-color:var(--border)}
.grp-h{padding:14px 17px;background:var(--bg-soft);cursor:pointer;display:flex;align-items:center;gap:11px;user-select:none}
.grp-h:hover{background:var(--bg-elev)}
.grp-h .ttl{font-size:15px;font-weight:700;flex:1;min-width:0}
.grp-h .cnt{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.grp-h .arw{font-size:10px;color:var(--text-dim);transition:transform .2s}
.grp.open .grp-h .arw{transform:rotate(90deg)}
.grp-b{display:none;padding:0 15px 12px}
.grp.open .grp-b{display:block}

/* 文档卡片 */
.doc{border-top:1px solid var(--border-soft);padding:15px 0 13px}
.doc:first-child{border-top:0}
.doc.sup{opacity:.72}
.doc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.doc-ref{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg-elev);color:var(--text-dim);border:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
.doc-ref.gl{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 28%,var(--border))}
.doc-ttl{font-size:14.5px;font-weight:650;color:var(--text);flex:1;min-width:0}
.doc-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-bottom:8px;font-variant-numeric:tabular-nums}
.doc-meta .st{font-weight:650}
.st-active{color:var(--ok)}
.st-sup{color:var(--danger)}
.doc-demand{font-size:13px;color:var(--text-muted);line-height:1.62;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--accent) 35%,transparent);margin-bottom:9px}
.doc-demand b{color:var(--text);font-weight:600}
.doc-demand .lbl{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);margin-right:6px;letter-spacing:.03em}
.doc-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px}
.doc-foot a{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 32%,transparent)}
.doc-foot a:hover{border-bottom-color:var(--accent)}
.doc-foot .roles{margin-left:auto;color:var(--text-dim);font-size:11px;letter-spacing:.02em}
.doc-foot .roles b{color:var(--text-muted);font-weight:600}

/* 主题 chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.chips button{font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--border-soft);background:transparent;color:var(--text-muted);cursor:pointer}
.chips button:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.chips button.on{background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent);font-weight:650}

.d-empty{padding:40px 0;text-align:center;color:var(--text-dim);font-size:13px}
.d-foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-dim);line-height:1.7}
.d-foot a{color:var(--accent);text-decoration:none}

@media(max-width:640px){
  .doc-page{padding:22px 15px 80px}
  .d-hero h1{font-size:22px}
  .doc-foot .roles{margin-left:0;width:100%;margin-top:4px}
  .d-views button{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>
<div class="doc-page">

  <div class="d-hero">
    <h1 id="hTitle">监管文档库</h1>
    <div class="sub" id="hSub"></div>
    <div class="d-badges" id="hBadges"></div>
  </div>

  <div class="d-disc" id="discBox"></div>

  <div class="d-bar">
    <div class="d-views" id="views">
      <button data-v="scenario" class="on">按场景</button>
      <button data-v="topic">按主题</button>
      <button data-v="type">按类型</button>
    </div>
    <div class="d-search"><input id="q" type="search" placeholder="搜标题或「要做什么」…" /></div>
  </div>

  <div class="chips" id="chips" style="display:none"></div>
  <div id="list"></div>

  <div class="d-foot" id="foot"></div>
</div>

<script>
const LANG = localStorage.getItem("hkii_lang") || "sc";
document.documentElement.lang = LANG === "tc" ? "zh-Hant" : "zh-Hans";
const T = o => (o && (o[LANG] || o.sc)) || "";

const UI = {
  sc: {
    title: "监管文档库",
    sub: "这里的文件不像新闻会过期。一份通函管两三年，一份指引管三五年——<b>新闻告诉你发生了什么，文档告诉你必须做什么</b>。同一条监管信息只是半衰期不同。",
    badgeTotal: n => `${n} 份现行文件`,
    scenario: "按场景", topic: "按主题", type: "按类型",
    search: "搜标题或「要做什么」…",
    empty: "没有匹配的文档",
    read: "读原文 PDF",
    dl: "下载 PDF",
    demandLbl: "要做什么",
    roleFront: "前线", roleMid: "中后台", roleLead: "管理层", roleCross: "跨境",
    foot: '全部文件为监管机构公开发布，本库仅做索引与导读。原始出处：<a href="https://www.ia.org.hk/en/legislative_framework/circulars/reg_matters/circulars_on_regulatory_matters_2026.html" target="_blank" rel="noopener">保险业监管局 — 监管通函</a> · <a href="https://www.ia.org.hk/en/legislative_framework/guidelines.html" target="_blank" rel="noopener">指引</a><br>回到 <a href="index.html">情报站首页</a> · <a href="tools.html">AI 工具情报</a>',
  },
  tc: {
    title: "監管文檔庫",
    sub: "這裡的文件不像新聞會過期。一份通函管兩三年，一份指引管三五年——<b>新聞告訴你發生了什麼，文檔告訴你必須做什麼</b>。同一條監管信息只是半衰期不同。",
    badgeTotal: n => `${n} 份現行文件`,
    scenario: "按場景", topic: "按主題", type: "按類型",
    search: "搜標題或「要做什麼」…",
    empty: "沒有匹配的文檔",
    read: "讀原文 PDF",
    dl: "下載 PDF",
    demandLbl: "要做什麼",
    roleFront: "前線", roleMid: "中後台", roleLead: "管理層", roleCross: "跨境",
    foot: '全部文件為監管機構公開發布，本庫僅做索引與導讀。原始出處：<a href="https://www.ia.org.hk/en/legislative_framework/circulars/reg_matters/circulars_on_regulatory_matters_2026.html" target="_blank" rel="noopener">保險業監管局 — 監管通函</a> · <a href="https://www.ia.org.hk/en/legislative_framework/guidelines.html" target="_blank" rel="noopener">指引</a><br>回到 <a href="index.html">情報站首頁</a> · <a href="tools.html">AI 工具情報</a>',
  }
};
const U = UI[LANG] || UI.sc;

const TOPIC_NAMES = {
  cyber: "网络安全", "third-party-risk": "第三方风险", compliance: "合规", conduct: "操守",
  product: "产品", cpd: "持续培训", governance: "治理", actuarial: "精算", capital: "资本",
  enforcement: "执法", reporting: "申报", recruitment: "招募", "premium-financing": "保费融资",
  ai: "AI 治理", illustration: "利益演示", risk: "风险管理", commission: "报酬",
  claims: "理赔", aml: "反洗钱", hni: "高净值", digital: "数字化", annuity: "年金",
  underwriting: "承保", reinsurance: "再保险", investment: "投资", group: "集团",
  "cross-border": "跨境", authorization: "授权", corporate: "公司"
};
const TYPE_NAMES = { circular: "通函", guideline: "指引" };

let DATA = null, state = { v: "scenario", q: "", filter: null };

function roles(r) {
  const pct = n => n >= 3 ? "●●●" : n === 2 ? "●●○" : n === 1 ? "●○○" : "○○○";
  const out = [];
  if (r.front) out.push(`${U.roleFront} ${pct(r.front)}`);
  if (r.midback) out.push(`${U.roleMid} ${pct(r.midback)}`);
  if (r.lead) out.push(`${U.roleLead} ${pct(r.lead)}`);
  if (r.cross) out.push(`${U.roleCross} ${pct(r.cross)}`);
  return out.join("　");
}

function card(d) {
  const sup = d.status === "superseded";
  const refTxt = d.ref || (d.type === "circular" ? "通函" : "指引");
  const refCls = d.type === "guideline" ? "doc-ref gl" : "doc-ref";
  const statusTxt = sup ? (LANG === "tc" ? "已取代" : "已取代") : (LANG === "tc" ? "现行" : "现行");
  const statusCls = sup ? "st-sup" : "st-active";
  const urls = [d.sourceUrl].concat(d.attachments || []);
  const dlLinks = urls.map((u, i) => {
    const nm = decodeURIComponent(u.split("/").pop());
    return `<a href="${u}" target="_blank" rel="noopener" download="${nm}">${i === 0 ? U.dl : nm}</a>`;
  }).join("　");
  return `<div class="doc${sup ? " sup" : ""}">
    <div class="doc-h">
      <span class="${refCls}">${refTxt}</span>
      <span class="doc-ttl">${d.title ? d.title.sc : ""}</span>
    </div>
    <div class="doc-meta">
      ${d.publishedAt ? `<span>${d.publishedAt}</span>` : ""}
      <span class="${statusCls} st">${statusTxt}</span>
      ${(d.topics || []).slice(0, 3).map(t => `<span>${TOPIC_NAMES[t] || t}</span>`).join("")}
    </div>
    <div class="doc-demand"><span class="lbl">${U.demandLbl}</span>${T(d.demand)}</div>
    <div class="doc-foot">
      <a href="${d.sourceUrl}" target="_blank" rel="noopener">${U.read}</a>
      ${dlLinks}
      <span class="roles">${roles(d.rolesImpact || {})}</span>
    </div>
  </div>`;
}

function match(d) {
  if (state.q) {
    const q = state.q.toLowerCase();
    const hay = [d.title && d.title.sc, d.title && d.title.tc, d.demand && d.demand.sc, d.demand && d.demand.tc, d.ref, (d.topics || []).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.v === "topic" && state.filter && !(d.topics || []).includes(state.filter)) return false;
  if (state.v === "type" && state.filter && d.type !== state.filter) return false;
  return true;
}

function render() {
  const docs = (DATA.docs || []).filter(match);
  document.getElementById("q").placeholder = U.search;
  const list = document.getElementById("list");
  const chips = document.getElementById("chips");

  // chips
  if (state.v === "topic" || state.v === "type") {
    chips.style.display = "flex";
    let keys;
    if (state.v === "topic") {
      const c = {};
      DATA.docs.forEach(d => (d.topics || []).forEach(t => c[t] = (c[t] || 0) + 1));
      keys = Object.keys(c).sort((a, b) => c[b] - c[a]);
    } else {
      keys = ["circular", "guideline"];
    }
    chips.innerHTML = keys.map(k => {
      const n = state.v === "topic" ? DATA.docs.filter(d => (d.topics || []).includes(k)).length : DATA.docs.filter(d => d.type === k).length;
      const nm = state.v === "topic" ? (TOPIC_NAMES[k] || k) : (TYPE_NAMES[k] || k);
      return `<button data-f="${k}" class="${state.filter === k ? "on" : ""}">${nm} ${n}</button>`;
    }).join("");
    chips.querySelectorAll("button").forEach(b => b.onclick = () => {
      state.filter = state.filter === b.dataset.f ? null : b.dataset.f;
      render();
    });
  } else {
    chips.style.display = "none";
  }

  if (!docs.length) {
    list.innerHTML = `<div class="d-empty">${U.empty}</div>`;
    return;
  }

  if (state.v === "scenario") {
    const sc = DATA.scenarios || {};
    const groups = {};
    docs.forEach(d => (d.scenario && d.scenario.length ? d.scenario : ["corporate"]).forEach(s => {
      (groups[s] = groups[s] || []).push(d);
    }));
    const order = ["annual", "incident-prep", "daily-sign", "hni-cross", "team-mgmt", "claims-service", "corporate"];
    list.innerHTML = order.filter(s => groups[s]).map((s, i) => {
      const nm = sc[s] ? T(sc[s]) : s;
      return `<div class="grp${i === 0 ? " open" : ""}" data-g="${s}">
        <div class="grp-h"><span class="ttl">${nm}</span><span class="cnt">${groups[s].length} 份</span><span class="arw">▶</span></div>
        <div class="grp-b">${groups[s].map(card).join("")}</div>
      </div>`;
    }).join("");
    list.querySelectorAll(".grp-h").forEach(h => h.onclick = () => h.parentElement.classList.toggle("open"));
  } else {
    list.innerHTML = `<div style="padding:0 15px">${docs.map(card).join("")}</div>`;
  }
}

function boot() {
  document.getElementById("hTitle").textContent = U.title;
  document.getElementById("hSub").innerHTML = U.sub;
  document.getElementById("foot").innerHTML = U.foot;
  document.querySelectorAll("#views button").forEach(b => {
    b.textContent = U[b.dataset.v];
    b.onclick = () => {
      state.v = b.dataset.v; state.filter = null;
      document.querySelectorAll("#views button").forEach(x => x.classList.toggle("on", x === b));
      render();
    };
  });
  document.getElementById("q").oninput = e => { state.q = e.target.value.trim(); render(); };

  fetch("data/docs.json?v=" + Date.now()).then(r => r.json()).then(d => {
    DATA = d;
    const n = (d.docs || []).length;
    document.getElementById("hBadges").innerHTML =
      `<span>${U.badgeTotal(n)}</span><span>保监局 IA</span><span>通函 ${d.docs.filter(x => x.type === "circular").length}</span><span>指引 ${d.docs.filter(x => x.type === "guideline").length}</span>`;
    const disc = d.meta && d.meta.disclaimer;
    document.getElementById("discBox").innerHTML = `<b>${LANG === "tc" ? "免責聲明" : "免责声明"}　</b>${T(disc)}`;
    render();
  }).catch(e => {
    document.getElementById("list").innerHTML = `<div class="d-empty">加载失败：${e.message}</div>`;
  });
}
boot();
</script>
</body>
</html>
