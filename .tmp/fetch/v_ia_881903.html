ticle":{"template_id":3,"share_url":"https://share.881903.com?article_id=2639898&article_column_id=11&fallbackurl=/news/local/2639898","share_image":"https://stream.881903.com/public/28e74912fd9f8c411f5a93d8c0104abb/2020/08/9c2f5eca18ddc4f39b8ad5b642ddc6e3.jpg","content_type":304,"content_id":2740760,"article_id":2639898,"title":"保監局：持續打擊中介人違規情況　維持市場秩序","subheading":"","highlight":0,"hashtags":[],"create_datetime":"2026-07-12 10:50:02","schedule_ts":"2026-07-12 10:48:00","last_update_datetime":"2026-07-12 10:48:00","content":"<p>保監局表示，局方作為發牌監管機構，處理牌照申請及續牌時，會按風險程度，採取針對性監管措施，包括施加牌照條件，限制業務模式及要求加密匯報等，以打擊作出不當或高危行為的中介人。</p>\n\n<p>保監局署理行為監管部主管吳維權發表文章，指上月初有兩間保險經紀公司，因未能有效管控轉介活動，被保監局施加續牌條件，須暫停接收轉介客戶。他指，這次不是「到此為止」的個別行動，若局方發現市場上有其他類似違規情況，必定及時作出相稱而有力的監管回應，以維持市場秩序。</p>\n\n<p><strong>保監局與金管局　本月推出跨行業背景查核安排</strong></p>\n\n<p>吳維權談到，保監局致力從源頭防範操守風險，包括應對「滾動的爛蘋果」現象，防止害群之馬透過轉換公司，規避作出不當行為所帶來的後果。他指，為防範「爛蘋果」在金融界內跨行業轉職，保監局與金管局合作，本月推出「跨行業背景查核安排」，涵蓋逾11萬名、在約1000間保險機構及銀行內，從事長期業務的保險中介人。</p>\n\n<p>保監局重申，相關工作不會停止，會與金管局持續檢視及優化安排，研究進一步打通機制，便利保險業及銀行業，就各自擬聘用委任人選，進行背景查核，促進金融業界操守水平持續提升。</p>\n","article_column":{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local","status":1},"display_article_column":[{"article_column_id":11,"article_column_type":4,"name":"本地","program_id":null,"program_host_id":null,"uri_code":"local"},{"article_column_id":13,"article_column_type":4,"name":"財經","program_id":null,"program_host_id":null,"uri_code":"finance"}],"parent_article_column":null,"article_media":[{"media_id":596843,"media_type":3,"title":null,"path":"/2020/08/596843/src/7c1e4cf3-ae2c-4771-b40b-96277bff11b9_1596869553.jpg","filename":"保監局.jpg","article_media_rlt_id":507994,"display_item_type":420,"thumbnail_media_id":null,"order_idx":1,"source_type":1,"shoot_by":"","source":null,"thumbnail_media_type":null,"caption":"保監局指會持續打擊中介人違規情況　資料圖片","resource":[{"resource_id":1920615,"path":"https://stream.881903.com/public/28e74912fd9f8c411f5a93d8c0104abb/2020
