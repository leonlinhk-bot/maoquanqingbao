<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>猫圈儿港险情报站</title>
<link rel="icon" href="assets/logo-cat-64.jpg" />
<meta name="description" content="港险市场数据仪表板：实时看板、每日动态、监管深度——只搬运公开数据，不加工不添油。" />
<meta name="keywords" content="香港保险,港险,保险情报,保险监管,IFA,家族办公室,保险市场数据" />
<meta property="og:title" content="猫圈儿港险情报站" />
<meta property="og:description" content="每天追踪监管与市场动态，一块屏幕驾驭行情——只搬运公开数据，不加工不添油。" />
<meta property="og:image" content="https://hkmaoquanqingbao.com/assets/logo-cat-256.jpg" />
<meta property="og:url" content="https://hkmaoquanqingbao.com" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="猫圈儿港险情报站" />
<meta name="twitter:description" content="港险市场数据仪表板——只搬运公开数据，不加工不添油。" />
<meta name="twitter:image" content="https://hkmaoquanqingbao.com/assets/logo-cat-256.jpg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <img class="logo-img" src="assets/logo-cat-256.jpg" alt="猫圈儿" width="42" height="42" />
        <div>
          <h1 id="brandName">猫圈儿港险情报站</h1>
          <p id="brandSub">维港猫圈儿 · 持牌人情报台</p>
        </div>
      </div>
      <div class="wechat-pill" id="wechatPill" style="cursor:pointer" title="点击查看公众号二维码">公众号：维港猫圈儿</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><a class="feedback-link" href="mailto:weigangmaoquan@gmail.com?subject=猫圈儿反馈">💬 反馈建议</a>
  
      <div class="toggle-row">
        <button type="button" data-lang="sc" class="on">简体</button>
        <button type="button" data-lang="tc">繁體</button>
      </div>
      <div class="toggle-row">
        <button type="button" data-theme-btn="dark" class="on">深色</button>
        <button type="button" data-theme-btn="light">浅色</button>
        <button type="button" data-theme-btn="auto">跟随系统</button>
      </div>
      <div id="pointsBar" class="points-bar"></div>
      <div id="footNote">专业参考 · 非销售/投资建议</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-row">
        <div class="page-title">
          <h2 id="viewTitle">今日脉搏</h2>
          <div class="sub" id="viewSub"></div>
        </div>
        <div class="controls">
          <div class="role-pills" id="rolePills"></div>
          <div class="search-box" id="searchBox">
            <span style="color:var(--text-dim)">⌕</span>
            <input id="q" type="search" placeholder="搜索标题/摘要/标签…" />
            <div class="hotsearch-dropdown" id="hotsearchDropdown" style="display:none">
              <div class="hotsearch-title">大家都在搜</div>
              <div class="hotsearch-list" id="hotsearchList"></div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<button class="mobile-toggle" id="menuBtn" type="button">菜单</button>
<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h3 id="dTitle"></h3>
    <button class="drawer-close" id="dClose" type="button">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<!-- 朋友圈海报 -->
<div class="modal-backdrop" id="posterModal" hidden>
  <div class="modal-sheet" role="dialog" aria-label="poster">
    <div class="modal-head">
      <strong id="posterModalTitle">朋友圈海报</strong>
      <button type="button" class="drawer-close" id="posterClose">✕</button>
    </div>
    <div class="modal-body">
      <p class="modal-tip" id="posterTip"></p>
      <div class="poster-stage">
        <canvas id="posterCanvas" width="1080" height="1350"></canvas>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="posterDlDark">🌙 深色 PNG</button>
        <button type="button" class="btn" id="posterDlLight">☀️ 浅色 PNG</button>
        <button type="button" class="btn" id="posterCopyMd">复制文案</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js?v=546"></script>

<div class="qr-backdrop" id="qrBackdrop" onclick="document.getElementById('qrPopup').classList.remove('show');document.getElementById('qrBackdrop').classList.remove('show')"></div>
<div class="qr-popup" id="qrPopup">
  <span class="qr-close" onclick="document.getElementById('qrPopup').classList.remove('show');document.getElementById('qrBackdrop').classList.remove('show')">✕</span>
  <img src="assets/qr-wechat.jpg" alt="维港猫圈儿" />
  <p><strong>公众号：维港猫圈儿</strong></p>
  <p style="font-size:12px;margin-top:4px">微信扫码关注，获取每日港险解读与陪伴。</p>
</div>
<script>
(function(){
  var p=document.getElementById("wechatPill");
  if(p) p.addEventListener("click",function(e){
    e.stopPropagation();
    document.getElementById("qrPopup").classList.add("show");
    document.getElementById("qrBackdrop").classList.add("show");
  });
})();
</script>

</body>
</html>
