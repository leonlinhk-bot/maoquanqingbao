# 猫圈儿港险情报站 · 使用度追踪 Worker
# 部署：cd workers/usage && npx wrangler deploy
# 需 CLOUDFLARE_API_TOKEN（Account + Workers Scripts Edit + Workers KV Storage Edit）
name = "hkii-usage"
main = "src/index.js"
compatibility_date = "2026-07-01"

# 自定义域名路由（Worker 挂到主站子域，绕开被墙的 workers.dev）
routes = [
  { pattern = "stats.hkmaoquanqingbao.com", custom_domain = true }
]

# 部署后把 account_id 填上（Cloudflare 仪表盘右侧，或 wrangler whoami）
# account_id = "YOUR_ACCOUNT_ID"

[[kv_namespaces]]
binding = "USAGE_KV"
# 先跑：npx wrangler kv namespace create USAGE_KV
# 再把返回的 id 填这里
id = "b68ca0e688184e279ce0b4f7f294be77"

[vars]
# CORS 允许源（生产域名）
ALLOWED_ORIGIN = "https://hkmaoquanqingbao.com"
